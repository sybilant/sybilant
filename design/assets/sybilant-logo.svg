<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Sybilant lambda and gear logo</title>
  <desc id="description">A lavender lambda interweaves with a gear; each shape carries its own black outline.</desc>
  <defs>
    <mask id="gear-center">
      <rect width="512" height="512" fill="white"/>
      <circle cx="238" cy="256" r="72.2" fill="black"/>
    </mask>

    <!-- Reveals the lambda everywhere except the lower long leg (black band),
         then re-reveals it inside the gear's center hole (white circle). The
         front leg is therefore clipped to the hole's rim, so it reads as
         passing through the hole and behind the gear body rather than over it. -->
    <mask id="weave-front">
      <rect width="512" height="512" fill="white"/>
      <path d="M259 243L436 528" stroke="black" stroke-width="110" fill="none" stroke-linecap="butt"/>
      <circle cx="238" cy="256" r="72.2" fill="white"/>
    </mask>

    <!-- The whole lambda as one unit: all black outline first, all lavender on
         top, so the short/long junction is a seamless union with no internal
         outline. Both feet reach the y=460 baseline. -->
    <g id="lambda">
      <g fill="none" stroke="#20202a" stroke-linecap="round">
        <path d="M140 52L394 460" stroke-width="94"/>
        <path d="M69 460L238 210" stroke-width="84"/>
      </g>
      <circle cx="140" cy="52" r="47" fill="#20202a"/>
      <g fill="none" stroke="#cfc4ea" stroke-linecap="round">
        <path d="M140 52L394 460" stroke-width="74"/>
        <path d="M69 460L238 210" stroke-width="64"/>
      </g>
      <circle cx="140" cy="52" r="37" fill="#cfc4ea"/>
    </g>
  </defs>

  <!-- Lambda behind the gear (its lower long leg emerges at bottom right). -->
  <use href="#lambda"/>

  <!-- Gear with its own black outline: expanded black silhouette, then purple. -->
  <g mask="url(#gear-center)">
    <g transform="translate(238 256) scale(1.5105)" fill="#20202a" stroke="#20202a" stroke-width="13.24" stroke-linejoin="round">
      <circle r="116"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(40)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(80)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(120)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(160)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(200)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(240)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(280)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(320)"/>
    </g>
    <g transform="translate(238 256) scale(1.5105)" fill="#6542a6">
      <circle r="116"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(40)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(80)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(120)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(160)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(200)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(240)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(280)"/>
      <rect x="-21" y="-151" width="42" height="62" rx="7" transform="rotate(320)"/>
    </g>
  </g>

  <!-- Lambda in front of the gear (everything above the hidden lower long leg). -->
  <use href="#lambda" mask="url(#weave-front)"/>
</svg>
