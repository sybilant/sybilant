StylesPath = styles
MinAlertLevel = warning
Vocab = Sybilant

# Vale 3.17 has no native Typst parser. Remove this association when Vale 3.18
# and typst2vast are available in the development environment.
[formats]
typ = md

[*.{md,typ}]
BasedOnStyles = Vale, Google, Sybilant
Google.Anthropomorphism = NO
Google.Contractions = NO
Google.ExcessiveClaims = NO
Google.Gender = NO
Google.GenderBias = NO
Google.LyHyphens = NO
Google.Parens = NO
Google.Passive = warning
Google.Semicolons = NO
Google.WordList = NO
Google.WordListCase = NO
Vale.Spelling = NO
Vale.Terms = NO

[*.typ]
# Ignore Typst code lines while retaining prose inside content blocks.
BlockIgnores = (?m)^#.*$
