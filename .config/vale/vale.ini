# Vale configuration for prose linting.
# https://vale.sh/docs/topics/config/
#
# The Google style rules are vendored under ./styles/Google so linting
# works offline and doesn't depend on network access during a commit. To
# refresh them from upstream after a Google style guide update, run:
#   vale --config .config/vale/vale.ini sync
StylesPath = styles
Packages = Google

# Only surface warning and error level alerts by default; drop this to
# "suggestion" for the full, more chatty rule set.
MinAlertLevel = warning

[*.{md,typ}]
BasedOnStyles = Google

# Enable or disable individual Google style checks here. Every check below
# is already on via BasedOnStyles; flip any entry to NO to turn it off, or
# add entries for checks you want to force on regardless of MinAlertLevel.
# https://vale.sh/docs/topics/styles/#google
Google.Acronyms           = error
Google.AMPM               = YES
Google.Anthropomorphism   = error
Google.Colons             = NO
Google.Contractions       = error
Google.DateFormat         = YES
Google.Ellipses           = NO
Google.EmDash             = YES
Google.ExcessiveClaims    = error
Google.Exclamation        = YES
Google.FirstPerson        = error
Google.Gender             = NO
Google.GenderBias         = NO
Google.HeadingPunctuation = error
Google.Headings           = error
Google.Jargon             = NO
Google.Latin              = YES
Google.LyHyphens          = YES
Google.OptionalPlurals    = YES
Google.Ordinal            = YES
Google.OxfordComma        = error
Google.Parens             = error
Google.Passive            = error
Google.Periods            = YES
Google.Quotes             = YES
Google.Ranges             = error
Google.Semicolons         = error
Google.Slang              = YES
Google.Spacing            = YES
Google.Spelling           = error
Google.Timeless           = error
Google.Units              = YES
Google.We                 = error
Google.Will               = error
Google.WordList           = NO
Google.WordListCase       = NO
